name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Prepare Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake ripgrep
      - name: Build and audit ROM-free application
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./build.sh --template-only
          python3 tools/prepare_web.py
          npm --prefix web ci
          npm --prefix web test
          npm --prefix web run build
          python3 tools/audit_web.py web/site
      - uses: actions/upload-artifact@v4
        with: {name: offline-site, path: web/site, retention-days: 7}
  desktop:
    needs: site
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - uses: actions/download-artifact@v4
        with: {name: offline-site, path: web/site}
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop test
      - name: Linux runtime and AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
          xvfb-run -a npm --prefix desktop run test:app
          npm --prefix desktop run dist:linux
      - name: Windows runtime and portable EXE
        if: runner.os == 'Windows'
        run: |
          npm --prefix desktop run test:app
          npm --prefix desktop run dist:windows
      - name: Test packaged Linux runtime
        if: runner.os == 'Linux'
        env:
          GBA_STUDIO_EXECUTABLE: ${{ github.workspace }}/dist/desktop/linux-unpacked/gba-studio
        run: xvfb-run -a npm --prefix desktop run test:app
      - name: Test packaged Windows runtime
        if: runner.os == 'Windows'
        env:
          GBA_STUDIO_EXECUTABLE: ${{ github.workspace }}/dist/desktop/win-unpacked/GBA Studio.exe
        run: npm --prefix desktop run test:app
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.exe
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'desktop-*', path: release, merge-multiple: true}
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum *.AppImage *.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.AppImage ./*.exe SHA256SUMS.txt --title "GBA Studio $GITHUB_REF_NAME" --notes-file ../docs/release-notes.md --repo "$GITHUB_REPOSITORY"

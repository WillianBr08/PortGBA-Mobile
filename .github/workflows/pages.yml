name: Build Android bases and Pages
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake ripgrep
      - name: Compile current interface and mGBA without ROM or signing key
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./build.sh --template-only
          python3 tools/prepare_web.py
          test ! -f .private/elite-redux.jks
      - name: Build site and validate browser packager
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npx tsx tests/build-smoke.ts
      - name: Verify actual APK signature and native alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/web-smoke.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 build/web-smoke.apk
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/web-tampered.apk; then
            echo "ERROR: tampered APK accepted"
            exit 1
          fi
          python3 tools/audit_web.py web/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site
  deploy:
    if: vars.GBA_STUDIO_PUBLISH == 'true' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
